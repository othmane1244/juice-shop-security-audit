name: Secrets (Gitleaks)

# Cherche des secrets dans les nouveaux commits de chaque push et de chaque PR.
# L'historique complet a été vérifié en local le 13 novembre 2026 (aucune fuite).
# Les actions sont épinglées par SHA de commit (tag indiqué en commentaire).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # gitleaks-action liste les commits de la PR

jobs:
  gitleaks:
    name: Gitleaks (nouveaux commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
